# Fly.io config for the ETI FastAPI origin. Deployed by .github/workflows/deploy.yml
# (or manually: flyctl deploy). Change `app` to a globally unique name if taken.
app = "eti-trading-intelligence"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8000"
  DATABASE_URL = "sqlite:////data/eti.db"
  LIVE_TRADING_ENABLED = "false"
  ALPACA_PAPER = "true"
  BINANCE_TESTNET_ENABLED = "true"
  BINANCE_LIVE_TRADING_ENABLED = "false"

# SQLite lives on a persistent volume. Keep exactly one machine while using SQLite.
[mounts]
  source = "eti_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Background jobs (mark-to-market, reconcile, streams) need an always-on machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/system/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
