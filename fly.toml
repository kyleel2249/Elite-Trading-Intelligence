# fly.toml app configuration file generated for elite-trading-intelligence on 2026-11-08T04:24:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'elite-trading-intelligence'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALPACA_PAPER = 'true'
  APP_ENV = 'production'
  BINANCE_LIVE_TRADING_ENABLED = 'false'
  BINANCE_TESTNET_ENABLED = 'true'
  DATABASE_URL = 'sqlite:////data/eti.db'
  LIVE_TRADING_ENABLED = 'false'
  PORT = '8000'

[[mounts]]
  source = 'eti_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/system/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
