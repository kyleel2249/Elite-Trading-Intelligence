# Fly.io config for the ETI FastAPI origin. Deployed by `flyctl deploy` (see docs/POSTGRES_FRANKFURT.md).
# Change `app` to a globally unique name if taken.
app = "eti-trading-intelligence"
# Frankfurt. Binance refuses US IP addresses, so the origin must not run in a US region.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8000"
  # DATABASE_URL is a Fly SECRET (fly secrets set DATABASE_URL=...), never committed here.
  # With this flag the app refuses to start on anything but PostgreSQL, so a missing secret cannot
  # silently put trading records in a throw-away SQLite file.
  ETI_REQUIRE_POSTGRES = "true"
  LIVE_TRADING_ENABLED = "false"
  ALPACA_PAPER = "true"
  BINANCE_TESTNET_ENABLED = "true"
  BINANCE_LIVE_TRADING_ENABLED = "false"

[http_service]
  internal_port = 8000
  force_https = true
  # Background jobs (mark-to-market, reconcile, streams) need an always-on machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/system/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
