services:
  eti:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/eti.db
      LIVE_TRADING_ENABLED: "false"
      ALPACA_PAPER: "true"
      BINANCE_TESTNET_ENABLED: "true"
    volumes:
      - eti-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  eti-data:
