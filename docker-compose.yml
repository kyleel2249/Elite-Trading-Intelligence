services:
  eti:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/eti.db
      LIVE_TRADING_ENABLED: "false"
      ALPACA_PAPER: "true"
      BINANCE_TESTNET_ENABLED: "true"
    volumes:
      - eti-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    profiles: ["queue"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  worker:
    build: .
    profiles: ["queue"]
    command: ["python", "-m", "app.infra.worker", "--queues", "default", "--beat"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/eti.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - eti-data:/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  eti-data:
  redis-data:
