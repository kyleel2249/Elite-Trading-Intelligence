# Render Blueprint — deploys the FastAPI origin that the Cloudflare Worker proxies to.
# Dashboard -> New -> Blueprint -> pick this repo. After it is live, copy the service URL
# (https://eti-api.onrender.com) into the Worker's BACKEND_URL (see docs/CLOUDFLARE.md).
services:
  - type: web
    name: eti-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/system/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eti-db
          property: connectionString
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: ALPACA_PAPER
        value: "true"
      - key: BINANCE_TESTNET_ENABLED
        value: "true"
      - key: BINANCE_LIVE_TRADING_ENABLED
        value: "false"
      # Optional provider keys — add in the Render dashboard (sync: false = never stored in git)
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: QUIVER_API_KEY
        sync: false

databases:
  - name: eti-db
    plan: free
    databaseName: eti
    user: eti
