# EXAMPLE ONLY: copy to .github/workflows/13f-refresh.yml to enable. Refreshes institutional-ownership data each quarter.
# Needs repository secrets: CLOUDFLARE_API_TOKEN (D1 edit), CLOUDFLARE_ACCOUNT_ID, SEC_USER_AGENT, optionally OPENFIGI_API_KEY.
# Check the SEC page for the current data-set file names/URLs first: https://www.sec.gov/data-research/sec-markets-data/form-13f-data-sets
name: 13f-refresh
on:
  workflow_dispatch:
    inputs:
      current_url: { description: "URL of the new quarter's 13F data set (.zip)", required: true }
      current_period: { description: "Quarter end, YYYY-MM-DD", required: true }
      previous_url: { description: "URL of the previous quarter's data set (.zip), optional", required: false }
      previous_period: { description: "Previous quarter end, YYYY-MM-DD", required: false }
jobs:
  build-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Download data sets (SEC requires a descriptive User-Agent)
        run: |
          curl -fsSL -A "${{ secrets.SEC_USER_AGENT }}" -o current.zip "${{ inputs.current_url }}"
          if [ -n "${{ inputs.previous_url }}" ]; then curl -fsSL -A "${{ secrets.SEC_USER_AGENT }}" -o previous.zip "${{ inputs.previous_url }}"; fi
      - name: Aggregate and resolve tickers
        env: { OPENFIGI_API_KEY: "${{ secrets.OPENFIGI_API_KEY }}" }
        run: |
          ARGS="--current current.zip --period ${{ inputs.current_period }} --out 13f.sql"
          if [ -f previous.zip ]; then ARGS="$ARGS --previous previous.zip --previous-period ${{ inputs.previous_period }}"; fi
          node scripts/13f-build.ts $ARGS
      - name: Load into D1
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
        run: |
          npx wrangler d1 migrations apply eti-portfolio-db --remote
          npx wrangler d1 execute eti-portfolio-db --remote --file 13f.sql
