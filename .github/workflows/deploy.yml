      - name: Verify scheduled AI autopilot readiness and paper cycle
        shell: bash
        env:
          ETI_EXECUTION_TOKEN: ${{ secrets.ETI_EXECUTION_TOKEN }}
        run: |
          set -euo pipefail
          base="https://elite-trading-intelligence-eti.cintexatechnologies.workers.dev"
          ready=0
          for attempt in $(seq 1 12); do
            response="$(curl --silent --show-error --fail --max-time 15 "$base/api/agents/autopilot")" || { sleep 5; continue; }
            if printf '%s' "$response" | node -e '
              let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const x=JSON.parse(s),scheduler=x.scheduler||{};
                if(x.enabled===true&&x.ready===true&&x.executionTokenConfigured===true&&x.auditLogConfigured===true&&x.portfolioStorageConfigured===true&&x.durableAuditConfigured===true&&scheduler.cron==="*/5 * * * *"&&scheduler.dispatchRegistered===true&&x.mode==="internal_paper_only"&&x.liveOrdersAllowed===false)process.exit(0);
                console.error("Autopilot readiness:",JSON.stringify({enabled:x.enabled,ready:x.ready,blockedReasons:x.blockedReasons,executionTokenConfigured:x.executionTokenConfigured,auditLogConfigured:x.auditLogConfigured,portfolioStorageConfigured:x.portfolioStorageConfigured,scheduler,mode:x.mode,liveOrdersAllowed:x.liveOrdersAllowed}));
                process.exit(1);
              });
            '; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1 || { echo "::error::Scheduled AI autopilot is not ready; inspect /api/agents/autopilot"; exit 1; }
          echo "Autopilot readiness verified: enabled, token configured, audit and portfolio storage bound, five-minute scheduler registered, paper-only mode."
          # Exercise the exact authenticated, read-only council preflight used by the scheduler.
          # This sends no order and does not persist a decision.
          test -n "$ETI_EXECUTION_TOKEN" || { echo "::error::ETI_EXECUTION_TOKEN unavailable to diagnostic step"; exit 1; }
          analysis_response="$(curl --silent --show-error --max-time 45 -w '__HTTP_CODE__%{http_code}' -X POST "$base/api/agents/analyze" -H "Authorization: Bearer $ETI_EXECUTION_TOKEN" -H 'content-type: application/json' --data '{"symbol":"BTCUSDT","interval":"15m","account":{"equityUsd":10000,"availableUsd":10000,"positionQuantity":0,"dailyPnlPct":0,"drawdownPct":0,"openRiskPct":0}}')"
          analysis_status="${analysis_response##*__HTTP_CODE__}"
          analysis_body="${analysis_response%__HTTP_CODE__*}"
          printf '%s' "$analysis_body" | HTTP_STATUS="$analysis_status" node -e '
            let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{let x={};try{x=JSON.parse(s)}catch{}
              if(process.env.HTTP_STATUS!=="200"){console.error("Authenticated agent analysis preflight failed:",JSON.stringify({httpStatus:process.env.HTTP_STATUS,error:x.error||"unknown",detail:x.detail||x.message||null,decision:x.decision?.action||x.decision||null}));process.exit(1);}
              if(!x.decision||!Array.isArray(x.reports)||x.reports.length!==12||Number(x.dataQuality?.candles)<100||!(Number(x.dataQuality?.atr14)>0)){console.error("Authenticated agent analysis response is incomplete or lacks usable ATR14/100-candle history:",JSON.stringify({hasDecision:!!x.decision,reportCount:x.reports?.length??0,candles:x.dataQuality?.candles??null,atr14:x.dataQuality?.atr14??null,dataQuality:x.dataQuality||null,decision:x.decision||null,deliberation:x.deliberation||null}));process.exit(1);}
              console.log("Authenticated twelve-agent analysis preflight passed:",JSON.stringify({
                action:x.decision.action||"unknown",confidence:x.decision.confidence??null,agreement:x.decision.consensus?.agreement??null,
                consensus:x.decision.consensus||null,rationale:x.decision.rationale||[],vetoedBy:x.decision.vetoedBy||null,
                proposalAvailable:!!x.decision.proposal,risk:x.risk?{decision:x.risk.decision,approved:x.risk.approved,vetoes:x.risk.vetoes||[],failedChecks:(x.risk.checks||[]).filter(c=>!c.passed).map(c=>({id:c.id,detail:c.detail}))}:null,
                deliberation:x.deliberation?{direction:x.deliberation.direction,reason:x.deliberation.reason,coverage:x.deliberation.coverage,participating:x.deliberation.participating,abstaining:x.deliberation.abstaining}:null,
                dataQuality:x.dataQuality||null,reports:x.reports.map(r=>({agent:r.agent,status:r.status,stance:r.stance,confidence:r.confidence,summary:r.summary,missingInputs:r.missingInputs||[]})),
              }));
            });'
          for symbol in BTCUSDT ETHUSDT SOLUSDT; do
            diagnostic="$(curl --silent --show-error --fail --max-time 20 "$base/api/market/diag?symbol=$symbol&interval=15m")" || { echo "::error::Could not read $symbol market-data diagnostics"; exit 1; }
            printf '%s' "$diagnostic" | SYMBOL="$symbol" node -e '
              let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const x=JSON.parse(s),p=(x.providers||[]).find(v=>v.provider==="bybit"),hosts=p?.hosts||[],ok=hosts.some(h=>h.ok===true&&Number(h.candles)>0);
                if(!ok){console.error("Primary Bybit candle diagnostics for "+process.env.SYMBOL+":",JSON.stringify({connectionStatus:p?.connectionStatus,hosts,failover:x.failover}));process.exit(1);}
                console.log("Primary Bybit 15m candles verified for "+process.env.SYMBOL+":",JSON.stringify(hosts.map(h=>({host:h.host,status:h.upstreamStatus,candles:h.candles,freshness:h.freshness}))));
              });
            '
            if [ "$symbol" = "ETHUSDT" ]; then sleep 11; fi
          done
          test -n "${ETI_WORKER_DEPLOYED_AT:-}" || { echo "::error::Worker deployment timestamp was not recorded"; exit 1; }
          cycle_ok=0
          for attempt in $(seq 1 72); do
            response="$(curl --silent --show-error --fail --max-time 15 "$base/api/agents/autopilot")" || { sleep 5; continue; }
            if printf '%s' "$response" | DEPLOY_STARTED_AT="$ETI_WORKER_DEPLOYED_AT" node -e '
              let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const x=JSON.parse(s),last=x.latest,dispatch=x.lastDispatch;
                const deployedAt=Date.parse(process.env.DEPLOY_STARTED_AT);
                const dispatchAt=dispatch&&typeof dispatch.at==="string"?Date.parse(dispatch.at):NaN;
                const cycleAt=last&&typeof last.at==="string"?Date.parse(last.at):NaN;
                const dispatched=dispatch&&dispatch.cron==="*/5 * * * *"&&Number.isFinite(dispatchAt)&&dispatchAt>=deployedAt&&dispatch.status==="completed"&&dispatch.liveOrdersAllowed===false;
                const fresh=dispatched&&x.lastCycleFresh===true&&Number.isFinite(cycleAt)&&cycleAt>=deployedAt&&Number(last.evaluated)>0&&Array.isArray(last.outcomes)&&last.liveOrdersAllowed===false;
                if(!fresh)process.exit(1);
                const counts={};for(const o of last.outcomes)counts[o.status]=(counts[o.status]||0)+1;
                console.log("Post-deployment autopilot dispatch and cycle verified:",JSON.stringify({dispatch:dispatch.status,dispatchedAt:dispatch.at,completedAt:dispatch.completedAt,at:last.at,evaluated:last.evaluated,submitted:last.submitted,outcomes:counts,reasons:last.outcomes.filter(o=>o.reason).map(o=>({symbol:o.symbol,reason:o.reason,analysisFailure:o.analysisFailure||null,councilDiagnostics:o.councilDiagnostics||null})).slice(0,8),mode:last.mode,liveOrdersAllowed:last.liveOrdersAllowed}));
              });
            '; then cycle_ok=1; break; fi
            sleep 5
          done
          if [ "$cycle_ok" -ne 1 ]; then
            response="$(curl --silent --show-error --fail --max-time 15 "$base/api/agents/autopilot" || printf '{}')"
            printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{let x={};try{x=JSON.parse(s)}catch{};const d=x.lastDispatch||null,l=x.latest||null;console.error("Autopilot post-deployment scheduler diagnosis:",JSON.stringify({lastDispatch:d?{status:d.status,at:d.at,completedAt:d.completedAt,error:d.error||null}:null,lastDispatchFresh:x.lastDispatchFresh,lastCycle:l?{at:l.at,skipped:l.skipped||null,error:l.error||null,evaluated:l.evaluated,submitted:l.submitted}:null,lastCycleFresh:x.lastCycleFresh}));});'
            echo "::error::No completed post-deployment autopilot cron cycle was observed within six minutes; distinguish missing dispatch from an unfinished or failed cycle using the heartbeat above."
            exit 1
          fi

      - name: Verify live sports service and D1 readiness
        shell: bash
        run: |
          base="https://elite-trading-intelligence-eti.cintexatechnologies.workers.dev"
          health_ok=0
          for attempt in $(seq 1 10); do
            response="$(curl --silent --show-error --fail "$base/api/sports/health")" || { sleep 3; continue; }
            if printf '%s' "$response" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const h = JSON.parse(input), odd = h.providers?.oddspapi || h.provider;
                const ready = h.database?.ready === true
                  && h.sports_paper_token_configured === true
                  && odd?.configured === true;
                const subscriptionReady = odd?.reachable !== true
                  || (Number(odd?.active_subscription_count) > 0 && Number(odd?.bookmaker_count) > 0);
                if (!ready || !subscriptionReady) {
                  console.error(JSON.stringify({database:h.database,provider:odd,paper_token_configured:h.sports_paper_token_configured}));
                  process.exit(1);
                }
                if (odd.reachable !== true) {
                  console.log("WARNING: Sports D1, paper token and OddsPapi configuration are ready, but the external provider is temporarily unreachable. Fixture checks will distinguish an upstream outage from a broken ETI route.");
                } else {
                  console.log("Sports D1, paper token, OddsPapi reachability and active bookmaker subscription verified.");
                }
              });
            '; then health_ok=1; break; fi
            sleep 3
          done
          test "$health_ok" -eq 1 || { echo "::error::ETI Sports health check failed. Verify ODDSPAPI_API_KEY, ETI_SPORTS_PAPER_TOKEN and D1 migrations."; exit 1; }

          football_ok=0
          provider_degraded=0
          for attempt in $(seq 1 5); do
            football_response="$(curl --silent --show-error -w '__HTTP_CODE__%{http_code}' "$base/api/sports/football/next?limit=1" || true)"
            football_status="${football_response##*__HTTP_CODE__}"
            football="${football_response%__HTTP_CODE__*}"
            if printf '%s' "$football" | HTTP_STATUS="$football_status" node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                let x;
                try { x = JSON.parse(input); } catch { console.error("Football route returned non-JSON output"); process.exit(1); }
                const status = process.env.HTTP_STATUS;
                if (status === "200") {
                  const ready = x.provider === "OddsPapi" && x.sport === "football"
                    && Array.isArray(x.events) && Number.isFinite(Number(x.fixture_candidates))
                    && Number.isFinite(Number(x.fixture_count));
                  if (!ready) { console.error(JSON.stringify({provider:x.provider,sport:x.sport,error:x.error})); process.exit(1); }
                  console.log("Football fixture route verified; zero upcoming fixtures is accepted as a valid empty result.");
                  return;
                }
                // A structured retryable upstream 429/5xx or provider rate-limit/network failure proves the route is deployed and handling the provider failure.
                // It is degraded market data, not a reason to report a broken ETI deployment.
                const providerStatus = Number(x.provider_status);
                const providerKind = String(x.kind || "");
                const knownProviderDegradation = providerKind === "rate_limit"
                  || (x.retryable === true && (
                    [408, 425, 429, 500, 502, 503, 504].includes(providerStatus)
                    || ["network", "timeout"].includes(providerKind)
                  ));
                const upstreamFailure = status === "502" && x.error === "global_football_scan_failed"
                  && knownProviderDegradation
                  && typeof x.hint === "string" && x.hint.length > 0;
                if (upstreamFailure) {
                  console.log("WARNING: ETI football route is deployed and returns a structured OddsPapi upstream failure (HTTP " + x.provider_status + "). Deployment readiness passes; live fixture data remains degraded until the provider recovers.");
                  process.exit(2);
                }
                console.error("Football route failure:", JSON.stringify({httpStatus:status,error:x.error,provider_status:x.provider_status,kind:x.kind}));
                process.exit(1);
              });
            '; then
              football_ok=1
              break
            else
              code=$?
              if [ "$code" -eq 2 ]; then provider_degraded=1; football_ok=1; break; fi
            fi
            sleep 3
          done
          test "$football_ok" -eq 1 || { echo "::error::ETI football route failed its application-level readiness check. Verify the route, active OddsPapi football subscription and provider response."; exit 1; }
          if [ "$provider_degraded" -eq 1 ]; then
            echo "::warning::ETI Sports is deployed, but OddsPapi currently has an upstream outage. Fixture scanning must be rechecked after provider recovery."
          fi

