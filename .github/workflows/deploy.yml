name: Deploy ETI to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

concurrency:
  group: eti-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run full Worker, security and type checks
        run: npm run check
      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Set CLOUDFLARE_API_TOKEN in GitHub Actions secrets"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Set CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets"; exit 1)
          npx wrangler d1 migrations apply eti-portfolio-db --remote

      - name: Validate required GainzAlgo secrets
        env:
          ETI_GAINZ_WEBHOOK_SECRET: ${{ secrets.ETI_GAINZ_WEBHOOK_SECRET }}
        run: |
          test -n "$ETI_GAINZ_WEBHOOK_SECRET" || (echo "::error::Set ETI_GAINZ_WEBHOOK_SECRET in GitHub Actions secrets"; exit 1)
          test "${#ETI_GAINZ_WEBHOOK_SECRET}" -ge 32 || (echo "::error::ETI_GAINZ_WEBHOOK_SECRET must contain at least 32 characters"; exit 1)

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync optional sports Worker secrets from GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ETI_SPORTS_PAPER_TOKEN: ${{ secrets.ETI_SPORTS_PAPER_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Origin of the Python wallet backend (https://host, no path). Set as a repository variable or secret named BACKEND_URL.
          BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL }}
          INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}
          INFURA_API_SECRET: ${{ secrets.INFURA_API_SECRET }}
          ETI_GAINZ_WEBHOOK_SECRET: ${{ secrets.ETI_GAINZ_WEBHOOK_SECRET }}
          ETI_GAINZ_ADMIN_TOKEN: ${{ secrets.ETI_GAINZ_ADMIN_TOKEN }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
        run: |
          for name in ODDSPAPI_API_KEY ETI_SPORTS_PAPER_TOKEN ODDS_API_KEY BACKEND_URL INFURA_API_KEY INFURA_API_SECRET ETI_GAINZ_WEBHOOK_SECRET ETI_GAINZ_ADMIN_TOKEN BITGET_API_KEY BITGET_API_SECRET BITGET_API_PASSPHRASE; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            fi
          done

      - name: Verify Bybit market routes and ETI execution safeguards
        shell: bash
        run: |
          base="https://elite-trading-intelligence-eti.cintexatechnologies.workers.dev"
          failed=0
          symbols_response="$(curl --silent --show-error -w '__HTTP_CODE__%{http_code}' "$base/api/market/symbols?market=all")" || { echo "::error::Could not contact the Bybit symbol endpoint"; failed=1; symbols_response='{}__HTTP_CODE__000'; }
          symbols_status="${symbols_response##*__HTTP_CODE__}"
          symbols="${symbols_response%__HTTP_CODE__*}"
          printf '%s' "$symbols" | HTTP_STATUS="$symbols_status" node -e '
            let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{
              const x=JSON.parse(s),cats=Array.isArray(x.categories)?x.categories:[],warnings=Array.isArray(x.warnings)?x.warnings:[];
              const allRegionBlocked=process.env.HTTP_STATUS==="502"&&cats.length===0&&warnings.length>=3&&warnings.every(w=>Array.isArray(w.attempts)&&w.attempts.length>0&&w.attempts.every(a=>a.status===403&&a.errorClass==="http_403_blocked"));
              if(allRegionBlocked){console.log("Bybit routes are deployed and both public hosts were attempted. The CI execution region is receiving HTTP 403 from Bybit; live catalogue availability is unverified from this region and must be checked from the user's region.");return;}
              const ok=process.env.HTTP_STATUS==="200"&&x.provider==="bybit"&&Array.isArray(x.symbols)&&x.symbols.length>0&&["spot","linear","inverse"].every(v=>cats.includes(v))&&Number(x.refreshEverySeconds)>0&&Number(x.refreshEverySeconds)<=60;
              if(!ok){console.error("Bybit catalogue:",JSON.stringify({httpStatus:process.env.HTTP_STATUS,provider:x.provider,categories:cats,count:x.count,refreshEverySeconds:x.refreshEverySeconds,warnings}));process.exit(1);}
              console.log("Bybit spot, linear and inverse catalogues verified; spot market data also backs the margin-compatible feed.");
            }catch(e){console.error("Invalid Bybit catalogue response:",e.message);process.exit(1);}});' || failed=1

          for market in spot futures; do
            suffix=""
            [ "$market" = "futures" ] && suffix="&market=futures"
            ticker_response="$(curl --silent --show-error -w '__HTTP_CODE__%{http_code}' "$base/api/market/ticker?symbol=BTCUSDT$suffix")" || { echo "::error::Could not contact the Bybit $market ticker"; failed=1; ticker_response='{}__HTTP_CODE__000'; }
            ticker_status="${ticker_response##*__HTTP_CODE__}"
            ticker="${ticker_response%__HTTP_CODE__*}"
            printf '%s' "$ticker" | HTTP_STATUS="$ticker_status" MARKET="$market" node -e '
              let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{
                const x=JSON.parse(s),attempts=Array.isArray(x.attempts)?x.attempts:[];
                const regionBlocked=process.env.HTTP_STATUS==="502"&&attempts.length>0&&attempts.every(a=>a.status===403&&a.errorClass==="http_403_blocked");
                if(regionBlocked){console.log("Bybit "+process.env.MARKET+" ticker route is deployed; both upstream hosts returned HTTP 403 from the CI region. Live price availability remains unverified from this region.");return;}
                const ok=process.env.HTTP_STATUS==="200"&&Number(x.lastPrice)>0&&Number(x.highPrice)>0&&Number(x.lowPrice)>0&&Number(x.highPrice)>=Number(x.lowPrice);
                if(!ok){console.error("Bybit ticker:",JSON.stringify({market:process.env.MARKET,httpStatus:process.env.HTTP_STATUS,lastPrice:x.lastPrice,highPrice:x.highPrice,lowPrice:x.lowPrice,error:x.error,attempts}));process.exit(1);}
                console.log("Bybit "+process.env.MARKET+" ticker verified with valid live price and 24h high/low.");
              }catch(e){console.error("Invalid Bybit ticker response:",e.message);process.exit(1);}});' || failed=1
          done

          status="$(curl --silent --show-error --fail "$base/api/execution/status")" || { echo "::error::Could not read ETI execution safeguards"; failed=1; status='{}'; }
          printf '%s' "$status" | node -e '
            let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{
              const x=JSON.parse(s);
              if(x.master_execution_token_configured!==true||x.audit_log_configured!==true){console.error("ETI execution safeguards:",JSON.stringify({masterToken:x.master_execution_token_configured,auditLog:x.audit_log_configured}));process.exit(1);}
              console.log("ETI master execution authentication and audit storage verified; no live order was submitted.");
            }catch(e){console.error("Invalid execution status response:",e.message);process.exit(1);}});' || failed=1
          exit "$failed"

      - name: Verify live GainzAlgo service, webhook and D1 readiness
        shell: bash
        env:
          ETI_GAINZ_ADMIN_TOKEN: ${{ secrets.ETI_GAINZ_ADMIN_TOKEN }}
        run: |
          for attempt in $(seq 1 10); do
            response="$(curl --silent --show-error --fail https://elite-trading-intelligence-eti.cintexatechnologies.workers.dev/api/gainz/status)" || { sleep 3; continue; }
            if printf '%s' "$response" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const h = JSON.parse(input);
                const engines = Array.isArray(h.engines) && h.engines.includes("gainz_v2") && h.engines.includes("gainz_v2_alpha");
                const ready = h.databaseConfigured === true && h.databaseReady === true && h.webhookConfigured === true && engines && h.automaticOrderSubmission === false;
                if (!ready) {
                  console.error(JSON.stringify({databaseConfigured:h.databaseConfigured,databaseReady:h.databaseReady,webhookConfigured:h.webhookConfigured,engines:h.engines,automaticOrderSubmission:h.automaticOrderSubmission}));
                  process.exit(1);
                }
                console.log("GainzAlgo readiness verified: V2, V2 Alpha, webhook secret and D1 tables are ready; automatic execution remains disabled.");
              });
            '; then
              if [ -n "$ETI_GAINZ_ADMIN_TOKEN" ]; then
                private_response="$(curl --silent --show-error --fail -H "Authorization: Bearer $ETI_GAINZ_ADMIN_TOKEN" https://elite-trading-intelligence-eti.cintexatechnologies.workers.dev/api/gainz/signals)" || { echo "::error::Gainz admin token was rejected by the live Worker"; exit 1; }
                printf '%s' "$private_response" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const x=JSON.parse(s);if(!Array.isArray(x.signals)||typeof x.count!=="number")process.exit(1);console.log("Gainz authenticated signal-history API verified.");});'
              fi
              exit 0
            fi
            sleep 3
          done
          echo "::error::GainzAlgo readiness failed. Verify ETI_GAINZ_WEBHOOK_SECRET, ETI_PORTFOLIO_DB binding and migration 0014."
          exit 1

      - name: Verify live sports service and D1 readiness
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            response="$(curl --silent --show-error --fail https://elite-trading-intelligence-eti.cintexatechnologies.workers.dev/api/sports/health)" || { sleep 3; continue; }
            if printf '%s' "$response" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const h = JSON.parse(input);
                const odd = h.providers?.oddspapi;
                const ready = h.database?.ready
                  && h.sports_paper_token_configured
                  && odd?.reachable
                  && Number(odd?.active_subscription_count) > 0
                  && Number(odd?.bookmaker_count) > 0
                  && Array.isArray(odd?.sports) && odd.sports.includes(10);
                if (!ready) {
                  console.error(JSON.stringify({database:h.database,provider:odd,paper_token_configured:h.sports_paper_token_configured}));
                  process.exit(1);
                }
                console.log("Sports readiness verified: D1 migrations, paper token, OddsPapi football subscription and bookmakers are ready.");
              });
            '; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::ETI Sports readiness check failed. Verify ODDSPAPI_API_KEY, ETI_SPORTS_PAPER_TOKEN, active football/bookmaker subscription, and D1 migrations."
          exit 1
