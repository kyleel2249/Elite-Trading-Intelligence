name: Deploy ETI to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "app/**"
      - "wrangler.jsonc"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/eti-diagnostics.yml"

concurrency:
  group: eti-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run full Worker, security and type checks
        run: npm run check
      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Set CLOUDFLARE_API_TOKEN in GitHub Actions secrets"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Set CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets"; exit 1)
          npx wrangler d1 migrations apply eti-portfolio-db --remote

      - name: Validate DataX integration configuration
        env:
          DATAX_INTEGRATION_SECRET: ${{ secrets.DATAX_INTEGRATION_SECRET }}
          DATAX_API_URL: ${{ vars.DATAX_API_URL }}
        run: |
          test -n "$DATAX_INTEGRATION_SECRET" || (echo "::error::Set DATAX_INTEGRATION_SECRET in GitHub Actions secrets"; exit 1)
          test "${#DATAX_INTEGRATION_SECRET}" -ge 32 || (echo "::error::DATAX_INTEGRATION_SECRET must contain at least 32 characters"; exit 1)
          test -n "$DATAX_API_URL" || (echo "::error::Set DATAX_API_URL in GitHub Actions variables"; exit 1)
          node --input-type=module -e 'const u=new URL(process.env.DATAX_API_URL);if(u.protocol!=="https:"||u.username||u.password||u.pathname!=="/"||u.search||u.hash)process.exit(1);'

      - name: Validate required GainzAlgo secrets
        env:
          ETI_GAINZ_WEBHOOK_SECRET: ${{ secrets.ETI_GAINZ_WEBHOOK_SECRET }}
        run: |
          test -n "$ETI_GAINZ_WEBHOOK_SECRET" || (echo "::error::Set ETI_GAINZ_WEBHOOK_SECRET in GitHub Actions secrets"; exit 1)
          test "${#ETI_GAINZ_WEBHOOK_SECRET}" -ge 32 || (echo "::error::ETI_GAINZ_WEBHOOK_SECRET must contain at least 32 characters"; exit 1)

      - name: Validate ETI paper-autopilot execution token
        env:
          ETI_EXECUTION_TOKEN: ${{ secrets.ETI_EXECUTION_TOKEN }}
        run: |
          test -n "$ETI_EXECUTION_TOKEN" || (echo "::error::Set ETI_EXECUTION_TOKEN in GitHub Actions secrets; scheduled paper autopilot is fail-closed without it"; exit 1)
          test "${#ETI_EXECUTION_TOKEN}" -ge 32 || (echo "::error::ETI_EXECUTION_TOKEN must contain at least 32 characters"; exit 1)

      - name: Deploy to Cloudflare Workers with versioned secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ETI_SPORTS_PAPER_TOKEN: ${{ secrets.ETI_SPORTS_PAPER_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Origin of the Python wallet backend (https://host, no path). Set as a repository variable or secret named BACKEND_URL.
          BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL }}
          INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}
          INFURA_API_SECRET: ${{ secrets.INFURA_API_SECRET }}
          ETI_GAINZ_WEBHOOK_SECRET: ${{ secrets.ETI_GAINZ_WEBHOOK_SECRET }}
          ETI_GAINZ_ADMIN_TOKEN: ${{ secrets.ETI_GAINZ_ADMIN_TOKEN }}
          ETI_EXECUTION_TOKEN: ${{ secrets.ETI_EXECUTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          DATAX_INTEGRATION_SECRET: ${{ secrets.DATAX_INTEGRATION_SECRET }}
          DATAX_API_URL: ${{ vars.DATAX_API_URL }}
        run: |
          set -euo pipefail
          secrets_file="/tmp/eti-worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node <<'NODE'
          const fs = require("node:fs");
          const names = [
            "ODDSPAPI_API_KEY", "ETI_SPORTS_PAPER_TOKEN", "ODDS_API_KEY", "BACKEND_URL",
            "INFURA_API_KEY", "INFURA_API_SECRET", "ETI_GAINZ_WEBHOOK_SECRET", "ETI_GAINZ_ADMIN_TOKEN",
            "ETI_EXECUTION_TOKEN", "ANTHROPIC_API_KEY",
            "BITGET_API_KEY", "BITGET_API_SECRET", "BITGET_API_PASSPHRASE",
            "BYBIT_API_KEY", "BYBIT_API_SECRET",
            "DATAX_INTEGRATION_SECRET",
          ];
          const secrets = Object.fromEntries(names.filter((name) => process.env[name]).map((name) => [name, process.env[name]]));
          fs.writeFileSync("/tmp/eti-worker-secrets.json", JSON.stringify(secrets), { mode: 0o600 });
          NODE
          # Deploy code and the full optional-secret set in one version. Secrets omitted here
          # remain inherited from the previous deployed version.
          if [ -n "${DATAX_API_URL:-}" ]; then
            npx --yes wrangler@4.148.0 deploy --secrets-file "$secrets_file" --var "DATAX_API_URL:${DATAX_API_URL}"
          else
            npx --yes wrangler@4.148.0 deploy --secrets-file "$secrets_file"
          fi
          # Record the actual successful Worker deployment time, not workflow start time.
          echo "ETI_WORKER_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Verify deployed Cloudflare Cron Trigger registration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/elite-trading-intelligence-eti/schedules")"
          printf '%s' "$response" | node -e '
            let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const x=JSON.parse(s),crons=(x.result?.schedules||[]).map(v=>v.cron);
              const required=["* * * * *","*/5 * * * *","*/15 * * * *"];
              const missing=required.filter(v=>!crons.includes(v));
              if(x.success!==true||missing.length){console.error("Cloudflare Worker Cron Trigger registration:",JSON.stringify({success:x.success,crons,missing}));process.exit(1);}
              console.log("Cloudflare Worker Cron Triggers verified:",JSON.stringify(crons));
            });'

      - name: Sync DataX Pages integration secret and redeploy production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATAX_INTEGRATION_SECRET: ${{ secrets.DATAX_INTEGRATION_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#DATAX_INTEGRATION_SECRET}" -ge 32
          printf '%s' "$DATAX_INTEGRATION_SECRET" | npx --yes wrangler@4.148.0 pages secret put ETI_INTEGRATION_SECRET --project-name=datax --env production
          deployments="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/datax/deployments?per_page=20")"
          deployment_id="$(printf '%s' "$deployments" | node --input-type=module -e '
            let input="";for await (const chunk of process.stdin) input+=chunk;
            const body=JSON.parse(input);
            if(body.success!==true||!Array.isArray(body.result))process.exit(2);
            const latest=body.result.filter(x=>x.environment==="production"&&x.latest_stage?.status==="success")
              .sort((a,b)=>Date.parse(b.created_on)-Date.parse(a.created_on))[0];
            if(!latest?.id)process.exit(3);
            process.stdout.write(latest.id);
          ')"
          test -n "$deployment_id"
          retry="$(curl --silent --show-error --fail -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/datax/deployments/$deployment_id/retry")"
          retry_id="$(printf '%s' "$retry" | node --input-type=module -e '
            let input="";for await (const chunk of process.stdin) input+=chunk;
            const body=JSON.parse(input);
            if(body.success!==true||!body.result?.id)process.exit(1);
            process.stdout.write(body.result.id);
          ')"
          ready=0
          for attempt in $(seq 1 30); do
            state="$(curl --silent --show-error --fail \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/datax/deployments/$retry_id" | node --input-type=module -e '
                let input="";for await (const chunk of process.stdin) input+=chunk;
                const body=JSON.parse(input);
                if(body.success!==true)process.exit(2);
                process.stdout.write(String(body.result?.latest_stage?.status||"unknown"));
              ')"
            if [ "$state" = "success" ]; then ready=1; break; fi
            if [ "$state" = "failure" ] || [ "$state" = "canceled" ]; then
              echo "::error::DataX Pages production deployment failed while applying the shared integration secret."
              exit 1
            fi
            sleep 4
          done
          test "$ready" -eq 1 || { echo "::error::Timed out waiting for the DataX Pages production deployment to finish."; exit 1; }
          echo "DataX Pages production deployment completed after synchronizing the shared integration secret."

      - name: Verify signed DataX production integration
        shell: bash
        env:
          DATAX_API_URL: ${{ vars.DATAX_API_URL }}
          DATAX_INTEGRATION_SECRET: ${{ secrets.DATAX_INTEGRATION_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { createHmac, randomBytes } from "node:crypto";

          const configured = String(process.env.DATAX_API_URL || "");
          const secret = String(process.env.DATAX_INTEGRATION_SECRET || "");
          if (secret.length < 32) {
            console.error("::error::DATAX_INTEGRATION_SECRET is missing or too short.");
            process.exit(1);
          }

          let origin;
          try {
            origin = new URL(configured);
            if (origin.protocol !== "https:" || origin.username || origin.password ||
                origin.pathname !== "/" || origin.search || origin.hash) {
              throw new Error("invalid_origin");
            }
          } catch {
            console.error("::error::DATAX_API_URL must be a valid HTTPS origin without a path.");
            process.exit(1);
          }

          const pathname = "/api/integrations/eti/summary";
          const endpoint = new URL(pathname, origin);
          const deadline = Date.now() + 120000;
          let lastStatus = 0;
          let lastError = "not_attempted";

          while (Date.now() < deadline) {
            const timestamp = String(Math.floor(Date.now() / 1000));
            const nonce = randomBytes(24).toString("base64url");
            const canonical = [timestamp, nonce, "GET", pathname].join("\n");
            const signature = createHmac("sha256", secret).update(canonical).digest("hex");

            let response;
            try {
              response = await fetch(endpoint, {
                method: "GET",
                headers: {
                  accept: "application/json",
                  "x-datax-timestamp": timestamp,
                  "x-datax-nonce": nonce,
                  "x-datax-signature": signature
                },
                redirect: "error",
                signal: AbortSignal.timeout(10000)
              });
            } catch (error) {
              lastError = error.name || "network_error";
              await new Promise(resolve => setTimeout(resolve, 5000));
              continue;
            }

            let payload;
            try { payload = await response.json(); }
            catch {
              lastStatus = response.status;
              lastError = "invalid_json";
              break;
            }

            if (response.ok && payload?.ok === true && payload?.source === "DataX" &&
                payload?.integrationVersion === 1 && payload?.asOf &&
                payload?.accounts && payload?.bandwidth && payload?.rewards &&
                payload?.reserves && payload?.tradingCapitalEligible === false) {
              console.log("Signed DataX production integration verified: HMAC authentication, nonce storage and aggregate snapshot succeeded. No member-level data or secret values were logged.");
              process.exit(0);
            }

            lastStatus = response.status;
            lastError = payload?.error || "unexpected_response";
            if (![401, 409, 502, 503].includes(response.status)) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }

          console.error("::error::Signed DataX production verification failed after deployment propagation retries:", JSON.stringify({
            status: lastStatus,
            error: lastError
          }));
          process.exit(1);
          NODE

      - name: Verify unified multi-exchange gateway and ETI safeguards
        shell: bash
        run: |
          base="https://elite-trading-intelligence-eti.cintexatechnologies.workers.dev"
          failed=0
          region_response="$(curl --silent --show-error --fail "$base/api/market/region")" || { echo "::error::Could not read the public market transport diagnostic"; exit 1; }
          printf '%s' "$region_response" | node -e '
            let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{
              const x=JSON.parse(s),p=x.providers||{},required=["binance","binance_usdm","bybit","okx","bitget"];
              if(x.transport!=="unified-cloudflare-worker-rest-gateway"||x.placementHint!=="cloudflare:global"||x.fixedEgressIp!==false||x.accountResidencyIsNotChanged!==true||required.some(v=>!Array.isArray(p[v])||!p[v].length)){
                console.error("Unified market transport:",JSON.stringify(x));process.exit(1);
              }
              console.log("Unified Worker gateway and Binance, Bybit, OKX and Bitget provider registry verified.");
            }catch(e){console.error("Invalid market transport response:",e.message);process.exit(1);}});' || exit 1
          providers_response="$(curl --silent --show-error --fail "$base/api/market/providers")" || { echo "::error::Could not read exchange provider registry"; exit 1; }
          printf '%s' "$providers_response" | node -e '
            let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{
              const x=JSON.parse(s),ids=(x.providers||[]).map(v=>v.id),required=["binance","binance_usdm","bybit","okx","bitget","bitget_mix"];
              if(required.some(v=>!ids.includes(v))){console.error("Exchange registry missing adapters:",ids);process.exit(1);}
              console.log("All six spot/derivatives provider adapters are registered without public API credentials.");
            }catch(e){console.error("Invalid provider registry response:",e.message);process.exit(1);}});' || exit 1
          symbols_response="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 -w '__HTTP_CODE__%{http_code}' "$base/api/market/symbols?venue=bybit&market=all")" || { echo "::error::Could not contact the Bybit symbol endpoint"; failed=1; symbols_response='{}__HTTP_CODE__000'; }
          symbols_status="${symbols_response##*__HTTP_CODE__}"
          symbols="${symbols_response%__HTTP_CODE__*}"
          printf '%s' "$symbols" | HTTP_STATUS="$symbols_status" node -e '
            let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{
              const x=JSON.parse(s),cats=Array.isArray(x.categories)?x.categories:[],warnings=Array.isArray(x.warnings)?x.warnings:[];
              const ok=process.env.HTTP_STATUS==="200"&&x.provider==="bybit"&&Array.isArray(x.symbols)&&x.symbols.length>0&&["spot","linear","inverse"].every(v=>cats.includes(v));
              if(!ok){console.error("Bybit catalogue:",JSON.stringify({httpStatus:process.env.HTTP_STATUS,provider:x.provider,categories:cats,count:x.count,warnings}));process.exit(1);}
              console.log("Bybit spot, linear and inverse catalogues verified.");
            }catch(e){console.error("Invalid Bybit catalogue response:",e.message);process.exit(1);}});' || failed=1
          for venue in bybit bitget binance okx; do
            for market in spot futures; do
              category=spot
              if [ "$market" = "futures" ]; then
                case "$venue" in
                  bybit) category=linear ;;
                  bitget) category=USDT-FUTURES ;;
                  binance) category=linear ;;
                  okx) category=swap ;;
                esac
              elif [ "$venue" = "bitget" ]; then category=SPOT; fi
              response="$(curl --silent --show-error --max-time 20 -w '__HTTP_CODE__%{http_code}' "$base/api/market/ticker?venue=$venue&market=$market&category=$category&symbol=BTCUSDT")" || { echo "::error::Could not contact $venue $market ticker"; failed=1; continue; }
              code="${response##*__HTTP_CODE__}"; body="${response%__HTTP_CODE__*}"
              printf '%s' "$body" | HTTP_STATUS="$code" VENUE="$venue" MARKET="$market" node -e '
                let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{
                  const x=JSON.parse(s),code=process.env.HTTP_STATUS,venue=process.env.VENUE,market=process.env.MARKET;
                  if(code==="200"&&Number(x.lastPrice)>0&&Number(x.highPrice)>0&&Number(x.lowPrice)>0&&Number(x.highPrice)>=Number(x.lowPrice)){console.log(venue+" "+market+" ticker verified · "+x.lastPrice);return;}
                  if(code==="502"&&x.error){console.log(venue+" "+market+" route is healthy; upstream returned a classified outage: "+x.error);return;}
                  console.error("Exchange ticker verification failed:",JSON.stringify({venue,market,httpStatus:code,error:x.error,lastPrice:x.lastPrice}));process.exit(1);
                }catch(e){console.error("Invalid exchange ticker JSON:",e.message);process.exit(1);}});' || failed=1
            done
          done
          for venue in binance okx; do
            response="$(curl --silent --show-error --max-time 20 -w '__HTTP_CODE__%{http_code}' "$base/api/market/derivatives?venue=$venue&market=futures&symbol=BTCUSDT&interval=1m")" || { echo "::error::Could not contact $venue derivatives endpoint"; failed=1; continue; }
            code="${response##*__HTTP_CODE__}"; body="${response%__HTTP_CODE__*}"
            printf '%s' "$body" | HTTP_STATUS="$code" VENUE="$venue" node -e '
              let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{
                const x=JSON.parse(s),code=process.env.HTTP_STATUS,venue=process.env.VENUE;
                if(code==="200"&&x.fundingRate!==undefined&&x.openInterest!==undefined){console.log(venue+" funding and open-interest endpoint verified.");return;}
                if(code==="502"&&x.error){console.log(venue+" derivatives route returned a classified upstream outage: "+x.error);return;}
                console.error("Derivatives verification failed:",JSON.stringify({venue,httpStatus:code,error:x.error}));process.exit(1);
              }catch(e){console.error("Invalid derivatives response:",e.message);process.exit(1);}});' || failed=1
          done
          curl --silent --show-error --fail "$base/terminal" -o /tmp/eti-terminal.html || { echo "::error::Pro Trading Terminal HTML is unavailable"; failed=1; }
          grep -q 'src="/terminal.js"' /tmp/eti-terminal.html || { echo "::error::Pro Trading Terminal script reference is missing"; failed=1; }
          curl --silent --show-error --fail "$base/terminal.js" -o /tmp/eti-terminal.js || { echo "::error::Pro Trading Terminal JavaScript is unavailable"; failed=1; }
          grep -q '/api/market/derivatives' /tmp/eti-terminal.js || { echo "::error::Terminal JavaScript is missing unified derivatives feed integration"; failed=1; }
          grep -q '/api/market/klines' /tmp/eti-terminal.js || { echo "::error::Terminal JavaScript is missing unified candle feed integration"; failed=1; }
          grep -q '/api/market/depth' /tmp/eti-terminal.js || { echo "::error::Terminal JavaScript is missing unified order-book feed integration"; failed=1; }
          bitget_probe_response="$(curl --silent --show-error --max-time 30 -w '__HTTP_CODE__%{http_code}' -H 'content-type: application/json' -d '{"symbol":"BTCUSDT","strategy":"intraday","engines":["swift","gainz"],"venue":"bitget","market":"futures","category":"USDT-FUTURES"}' "$base/api/omnisignal")" || { echo "::error::Could not contact the Bitget Omnisignal route"; failed=1; bitget_probe_response='{}__HTTP_CODE__000'; }
          bitget_probe_code="${bitget_probe_response##*__HTTP_CODE__}"
          bitget_probe_body="${bitget_probe_response%__HTTP_CODE__*}"
          if [ "$bitget_probe_code" = "200" ]; then
            printf '%s' "$bitget_probe_body" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const x=JSON.parse(s),q=x.dataQuality||{};if(q.venue!=="bitget"||q.market!=="futures"||!x.decision){console.error("Bitget Omnisignal contract:",JSON.stringify({venue:q.venue,market:q.market,decision:x.decision,error:x.error}));process.exit(1);}console.log("Bitget Omnisignal returned selected-venue analysis.");}catch(e){console.error(e.message);process.exit(1);}});' || failed=1
          elif [ "$bitget_probe_code" = "503" ]; then
            printf '%s' "$bitget_probe_body" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const x=JSON.parse(s);if(x.error!=="market_data_unavailable"||x.submitsOrder!==false){console.error("Unexpected Bitget outage:",JSON.stringify(x));process.exit(1);}console.log("Bitget Omnisignal reports a classified upstream outage; execution remains disabled.");}catch(e){console.error(e.message);process.exit(1);}});' || failed=1
          else echo "::error::Bitget Omnisignal returned unexpected HTTP $bitget_probe_code"; printf '%s\n' "$bitget_probe_body"; failed=1; fi
          forecast_response="$(curl --silent --show-error --max-time 30 -w '__HTTP_CODE__%{http_code}' "$base/api/analysis/extremes?symbol=BTCUSDT")" || { echo "::error::Could not contact the 24-hour forecast endpoint"; failed=1; forecast_response='{}__HTTP_CODE__000'; }
          forecast_status="${forecast_response##*__HTTP_CODE__}"; forecast="${forecast_response%__HTTP_CODE__*}"
          printf '%s' "$forecast" | HTTP_STATUS="$forecast_status" node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const x=JSON.parse(s),h=x.forecast?.high,l=x.forecast?.low,c=x.forecast?.confidence,validTime=v=>typeof v==="string"&&Number.isFinite(Date.parse(v));const ok=process.env.HTTP_STATUS==="200"&&x.status==="ready"&&Number(h?.price)>0&&Number(l?.price)>0&&validTime(h?.time?.expectedAt)&&validTime(l?.time?.expectedAt)&&Number(x.history?.timeSampleDays)>=5&&Number(x.history?.priceSampleDays)>=5&&Number(c?.score)>=0&&Number(c?.score)<=100;if(!ok){console.error("24-hour forecast readiness:",JSON.stringify({httpStatus:process.env.HTTP_STATUS,status:x.status,error:x.error,detail:x.detail,reason:x.reason,provider:x.provider,failover:x.failover,providerFailures:x.providerFailures,history:x.history}));process.exit(1);}console.log("24-hour high/low forecast verified.");}catch(e){console.error(e.message);process.exit(1);}});' || failed=1
          status="$(curl --silent --show-error --fail "$base/api/execution/status")" || { echo "::error::Could not read ETI execution safeguards"; failed=1; status='{}'; }
          printf '%s' "$status" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const x=JSON.parse(s);if(x.master_execution_token_configured!==true||x.audit_log_configured!==true){console.error("ETI execution safeguards:",JSON.stringify({masterToken:x.master_execution_token_configured,auditLog:x.audit_log_configured}));process.exit(1);}console.log("ETI execution authentication and audit storage verified; no live order submitted.");}catch(e){console.error(e.message);process.exit(1);}});' || failed=1
          exit "$failed"
      - name: Verify live GainzAlgo service, webhook and D1 readiness
