name: Deploy ETI to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

concurrency:
  group: eti-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate Worker bundle
        run: npm run check:worker
      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Set CLOUDFLARE_API_TOKEN in GitHub Actions secrets"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Set CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets"; exit 1)
          npx wrangler d1 migrations apply eti-portfolio-db --remote

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live sports service and D1 readiness
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            response="$(curl --silent --show-error --fail https://elite-trading-intelligence-eti.cintexatechnologies.workers.dev/api/sports/health)" || { sleep 3; continue; }
            if printf '%s' "$response" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const h = JSON.parse(input);
                const odd = h.providers?.oddspapi;
                const ready = h.database?.ready
                  && h.sports_paper_token_configured
                  && odd?.reachable
                  && Number(odd?.active_subscription_count) > 0
                  && Number(odd?.bookmaker_count) > 0
                  && Array.isArray(odd?.sports) && odd.sports.includes(10);
                if (!ready) {
                  console.error(JSON.stringify({database:h.database,provider:odd,paper_token_configured:h.sports_paper_token_configured}));
                  process.exit(1);
                }
                console.log("Sports readiness verified: D1 migrations, paper token, OddsPapi football subscription and bookmakers are ready.");
              });
            '; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::ETI Sports readiness check failed. Verify ODDSPAPI_API_KEY, ETI_SPORTS_PAPER_TOKEN, active football/bookmaker subscription, and D1 migrations."
          exit 1
