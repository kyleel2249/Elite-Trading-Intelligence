name: Deploy edge Worker

# Optional. Deploys the Cloudflare Worker proxy from GitHub Actions and injects BACKEND_URL.
# Required repository settings:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: BACKEND_URL   (https origin of the FastAPI app, no trailing slash)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required configuration
        run: |
          missing=0
          [ -z "$CLOUDFLARE_API_TOKEN" ] && echo "::error::Secret CLOUDFLARE_API_TOKEN is not set" && missing=1
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set" && missing=1
          [ -z "$BACKEND_URL" ] && echo "::error::Repository variable BACKEND_URL is not set (deploy FastAPI first, see docs/CLOUDFLARE.md)" && missing=1
          exit $missing

      - run: npm install

      - name: Deploy Worker
        run: npx wrangler deploy --var "BACKEND_URL:${BACKEND_URL%/}"
