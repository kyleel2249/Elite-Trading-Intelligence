name: ETI MT5 Bridge Tests
on:
  push:
    branches: [main]
    paths:
      - "mt5-bridge/**"
      - ".github/workflows/mt5-bridge-tests.yml"
  pull_request:
    paths:
      - "mt5-bridge/**"
      - ".github/workflows/mt5-bridge-tests.yml"
  workflow_dispatch:
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2.8,<3" "httpx>=0.27,<1" "pytest>=8,<9"
      - name: Compile bridge
        run: python -m py_compile mt5-bridge/bridge.py
      - name: Run offline bridge tests
        run: python -m pytest -q mt5-bridge/test_bridge.py
