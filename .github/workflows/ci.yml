name: ETI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q app tests

      - name: Unit tests
        env:
          PYTHONPATH: .
          LIVE_TRADING_ENABLED: "false"
          ALPACA_PAPER: "true"
          BINANCE_TESTNET_ENABLED: "true"
          BINANCE_LIVE_TRADING_ENABLED: "false"
        run: python -m pytest -q --tb=short

      - name: Import app
        env:
          PYTHONPATH: .
        run: python -c "from app.main import app; print(app.title)"

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Bundle Worker (dry run, no credentials needed)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
