name: ETI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python application
        run: python -m compileall -q app tests

      - name: Python unit tests
        env:
          PYTHONPATH: .
          LIVE_TRADING_ENABLED: "false"
          ALPACA_PAPER: "true"
          BINANCE_TESTNET_ENABLED: "true"
          BINANCE_LIVE_TRADING_ENABLED: "false"
        run: python -m pytest -q --tb=short

      - name: Import application
        env:
          PYTHONPATH: .
        run: python -c "from app.main import app; print(app.title)"

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Run Worker tests and bundle validation
        run: npm run check
