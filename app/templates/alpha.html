<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="ETI Global Alpha Intelligence Center: research, validation and risk-gated paper trading." />
<meta name="robots" content="noindex,nofollow" />
<title>ETI — Global Alpha Intelligence Center</title>
<style>
:root{--bg:#070b12;--card:rgba(18,28,45,.78);--solid:#121c2d;--text:#e8eef8;--muted:#8b9bb4;--cyan:#22d3ee;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--gold:#fbbf24;--purple:#a78bfa;--border:rgba(56,189,248,.16)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#0e2a3d 0%,transparent 50%),var(--bg);color:var(--text);line-height:1.45}
header{position:sticky;top:0;z-index:20;background:rgba(7,11,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:.7rem 1.1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1rem;letter-spacing:.04em;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:.72rem}
a.nav,.btn{color:var(--text);text-decoration:none;background:rgba(30,41,59,.85);border:1px solid var(--border);padding:.38rem .65rem;border-radius:8px;font-size:.76rem;cursor:pointer}
.btn:hover,a.nav:hover{border-color:var(--cyan)}.btn.primary{color:var(--cyan);border-color:rgba(34,211,238,.45)}.btn:disabled{opacity:.5;cursor:wait}
input,select{background:#0a1220;border:1px solid var(--border);color:var(--text);padding:.38rem .5rem;border-radius:8px;font-size:.78rem}
#tabs{display:flex;flex-wrap:wrap;gap:.35rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--border)}
#tabs button{background:transparent;color:var(--muted);border:1px solid transparent;padding:.3rem .55rem;border-radius:8px;font-size:.74rem;cursor:pointer}
#tabs button.on{color:var(--cyan);border-color:var(--border);background:rgba(34,211,238,.08)}
main{max-width:1500px;margin:0 auto;padding:1rem 1.1rem 2.5rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.65rem;margin-bottom:1rem}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.7rem .85rem}.kpi .l{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.kpi .v{font-size:1.15rem;font-weight:650;margin-top:.15rem}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:.9rem;overflow:hidden}
.ph{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center;padding:.65rem .9rem;border-bottom:1px solid var(--border)}.ph h2{margin:0;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan)}
.pb{padding:.7rem .9rem;overflow:auto;max-height:560px}.note{color:var(--muted);font-size:.74rem;margin:.2rem 0 .6rem}
table{width:100%;border-collapse:collapse;font-size:.76rem}th,td{text-align:left;padding:.38rem .45rem;border-bottom:1px solid rgba(56,189,248,.08);vertical-align:top}th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--solid)}
tr.click{cursor:pointer}tr.click:hover{background:rgba(30,41,59,.7)}
.tag{display:inline-block;font-size:.64rem;padding:.1rem .4rem;border-radius:999px;background:rgba(59,130,246,.2);color:#93c5fd;margin:0 .2rem .15rem 0}
.tag.g{background:rgba(34,197,94,.16);color:#86efac}.tag.r{background:rgba(239,68,68,.16);color:#fca5a5}.tag.y{background:rgba(251,191,36,.16);color:var(--gold)}.tag.p{background:rgba(167,139,250,.16);color:var(--purple)}
.empty{color:var(--muted);text-align:center;padding:1.2rem 0;font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.6rem}
.modal{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:1rem}.modal.open{display:flex}
.mc{background:var(--solid);border:1px solid var(--border);border-radius:12px;max-width:820px;width:100%;max-height:86vh;overflow:auto;padding:1rem 1.2rem}.mc h3{margin:.1rem 0 .5rem;color:var(--cyan)}
pre{background:#0a1220;padding:.65rem;border-radius:8px;font-size:.7rem;overflow:auto;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;bottom:1rem;right:1rem;z-index:60;background:#0f172a;border:1px solid var(--cyan);padding:.65rem .9rem;border-radius:10px;font-size:.8rem;display:none;max-width:340px}.toast.show{display:block}
.warn{border-left:3px solid var(--gold);padding:.4rem .7rem;background:rgba(251,191,36,.07);font-size:.76rem;margin-bottom:.7rem;border-radius:0 8px 8px 0}
.bar{height:6px;background:#1e293b;border-radius:3px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
</style>
</head>
<body>
<header>
  <div><h1>ETI GLOBAL ALPHA INTELLIGENCE CENTER</h1><div class="sub">Discovery AI · Research AI · Decision AI — v{{ version }} — research priority is never a trade instruction</div></div>
  <div class="row" style="margin:0">
    <input id="apikey" aria-label="API key" type="password" placeholder="X-API-Key (kept in this tab only)" size="22" autocomplete="off" />
    <a class="nav" href="/">Dashboard</a><a class="nav" href="/data-intel">Investor Intel</a><a class="nav" href="/alerts">Alerts</a>
  </div>
</header>
<div id="tabs" role="tablist" aria-label="Global Alpha sections"></div>
<main>
  <div class="kpis" id="kpis" aria-label="Key figures"></div>
  <div id="view"></div>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mc"><div class="row" style="justify-content:space-between"><h3 id="mt"></h3><button class="btn" onclick="closeM()">Close</button></div><div id="mb"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=2)=>v==null?'—':(typeof v==='number'?v.toLocaleString(undefined,{maximumFractionDigits:d}):esc(v));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4500)};
const closeM=()=>$('#modal').classList.remove('open');
function openM(title,html){$('#mt').textContent=title;$('#mb').innerHTML=html;$('#modal').classList.add('open')}
async function api(path,opt={}){
  const h={'Accept':'application/json'};const k=$('#apikey').value.trim();
  if(k)h['X-API-Key']=k;
  if(opt.method==='POST')h['Content-Type']='application/json';
  const r=await fetch(path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error((d&&(d.detail||d.reasons))?JSON.stringify(d.detail||d.reasons):('HTTP '+r.status));
  return d}
async function act(btn,path,body,after){btn.disabled=true;try{const d=await api(path,{method:'POST',body});toast('Done');if(after)after(d);return d}catch(e){toast(e.message)}finally{btn.disabled=false}}
const tag=(t,c='')=>`<span class="tag ${c}">${esc(t)}</span>`;
const sc=v=>v==null?'—':`<div class="bar" title="${v}"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div>${fmt(v,1)}`;
const stc=s=>({CONFIRMED_OPPORTUNITY:'g',HIGH_CONVICTION_OPPORTUNITY:'g',DEVELOPING_OPPORTUNITY:'y',EARLY_ACCUMULATION:'y',REJECTED:'r',INVALIDATED:'r'}[s]||'');
const TABS=[['overview','Global Market Overview'],['equities','Equity Scanner'],['crypto','Crypto Scanner'],['tokens','Emerging Tokens'],['leader','Early Alpha Leaderboard'],
['inst','Institutional Accumulation'],['whales','Whale Activity'],['investors','Investor Tracker'],['sec','SEC Disclosures'],['elite','Elite Trader Database'],['newtraders','Newly Discovered Traders'],
['lab','Strategy Extraction Lab'],['comp','Strategy Competition'],['engines','Engines & Validation'],['trading','Automated Trading'],['portfolio','Portfolio Exposure'],['perf','Performance & Accountability']];
let cur='overview';
$('#tabs').innerHTML=TABS.map(t=>`<button role="tab" data-t="${t[0]}">${t[1]}</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.t;history.replaceState(null,'','#'+cur);render()}};
async function render(){
  document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===cur);b.setAttribute('aria-selected',b.dataset.t===cur)});
  const v=$('#view');v.innerHTML='<div class="empty">Loading…</div>';
  try{v.innerHTML=await VIEWS[cur]()}catch(e){v.innerHTML=`<div class="warn">Could not load: ${esc(e.message)}</div>`}
  try{kpis()}catch(e){}
}
async function kpis(){
  const o=await api('/api/alpha/overview');const s=o.candidates_by_status||{};
  $('#kpis').innerHTML=[['Candidates',o.candidates_total],['Early accumulation',s.EARLY_ACCUMULATION||0],['Developing',s.DEVELOPING_OPPORTUNITY||0],
  ['Confirmed+',(s.CONFIRMED_OPPORTUNITY||0)+(s.HIGH_CONVICTION_OPPORTUNITY||0)],['Rejected',(s.REJECTED||0)+(s.INVALIDATED||0)],['Open plans',o.open_plans],
  ['Providers OK',o.providers_ok+'/'+o.providers_total],['Live exec',o.alpha_live_execution_authorized&&o.live_trading_enabled?'AUTHORIZED':'OFF']].map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('')}
function candTable(rows){
  if(!rows.length)return '<div class="empty">No candidates yet. Run a scan (requires X-API-Key if configured).</div>';
  return `<table><tr><th>Asset</th><th>Class</th><th>Status</th><th>Stage</th><th>Early alpha</th><th>Rank</th><th>Price</th><th>Vol 24h</th><th>Discovered</th></tr>`+
  rows.map(r=>`<tr class="click" tabindex="0" data-a="cand" data-id="${esc(r.candidate_id)}"><td><b>${esc(r.symbol)}</b><div class="sub">${esc(r.exchange||'')} ${esc(r.name||'')}</div></td><td>${esc(r.asset_class)}</td>
  <td>${tag(r.status.replaceAll('_',' '),stc(r.status))}</td><td>${esc(r.stage||'—')}</td><td>${sc(r.early_alpha_score)}</td><td>${sc(r.overall_rank_score)}</td><td>${fmt(r.last_price,6)}</td><td>${fmt(r.volume_24h,0)}</td><td class="sub">${esc((r.discovered_at||'').slice(0,16))}</td></tr>`).join('')+'</table>'}
async function candDetail(id){
  const d=await api('/api/alpha/candidates/detail?candidate_id='+encodeURIComponent(id));const v=(d.evidence||{}).validation;
  const p=d.plan||{};const sub=d.scores||{};
  openM(d.symbol+' — '+d.status.replaceAll('_',' '),`
   <div class="warn">Discovery ≠ trade. Early-alpha is a research priority with stated uncertainty (coverage ${fmt(sub.early_alpha_coverage,2)}; band ${esc(JSON.stringify(sub.early_alpha_band))}).</div>
   <p>${tag(d.asset_class)}${tag(d.stage||'no stage')}${tag(d.data_status)}${tag('provider: '+d.provider)}</p>
   <p><b>Why discovered</b></p><ul>${(d.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
   ${(d.rejection_reasons||[]).length?`<p><b>Rejection reasons</b></p><ul>${d.rejection_reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}
   <p><b>Scores</b> early ${fmt(sub.early_alpha,1)} · technical ${fmt(sub.technical,1)} · liquidity ${fmt(sub.liquidity,1)} · risk ${fmt(sub.risk,1)} · independent validation ${fmt(sub.independent_validation,1)} · onchain ${fmt(sub.onchain,1)} · fundamental ${fmt(sub.fundamental,1)} (— = not measurable)</p>
   <p><b>Levels</b> entry zone ${esc(JSON.stringify(p.entry_zone))} · invalidation ${fmt(p.invalidation_level,6)} · TP ${esc(JSON.stringify(p.tp||null))}</p>
   ${v?`<p><b>Decision layer</b> ${tag(v.decision,v.executable?'g':'r')} validation ${v.validation_score}</p><table><tr><th>Check</th><th>Result</th><th>Detail</th></tr>${v.checks.map(c=>`<tr><td>${esc(c.id)}</td><td>${c.pass?tag('pass','g'):tag(c.hard?'FAIL (hard)':'fail','r')}</td><td>${esc(c.detail)}</td></tr>`).join('')}</table>
   <p><b>Engines</b></p>${v.engines.map(e=>`<div>${tag(e.engine,'p')}${tag(e.available?e.bias:'unavailable',e.bias==='bullish'?'g':e.bias==='bearish'?'r':'')} ${esc((e.evidence||[]).slice(0,2).join(' · '))}</div>`).join('')}
   <p><b>Attribution</b></p><pre>${esc(JSON.stringify(v.attribution,null,1))}</pre>`:'<p class="note">Not yet independently validated.</p>'}
   <div class="row"><button class="btn primary" id="vbtn">Run independent validation</button><button class="btn" id="ebtn">Execute (paper)</button></div>
   <p><b>Predictions on record</b></p>${(d.predictions||[]).map(x=>`<div class="sub">${esc(x.created_at.slice(0,16))} price ${fmt(x.price,6)} conf ${x.confidence} horizon ${x.horizon_hours}h → ${esc(x.outcome||'open')}</div>`).join('')||'<div class="sub">none</div>'}`);
  $('#vbtn').onclick=async e=>{const r=await act(e.target,'/api/alpha/validate',{candidate_id:id});if(r){candDetail(id);render()}};
  $('#ebtn').onclick=async e=>{const r=await act(e.target,'/api/alpha/execute',{candidate_id:id,environment:'paper'});if(r)openM('Execution result','<pre>'+esc(JSON.stringify(r,null,1))+'</pre>')};
}
function scanBar(kind,extra=''){return `<div class="row"><button class="btn primary" onclick="doScan(this,'${kind}')">Run ${kind} scan</button>${extra}</div>`}
async function doScan(b,kind){const r=await act(b,'/api/alpha/scan',{kind});if(r)openM('Scan result','<pre>'+esc(JSON.stringify(r,null,1))+'</pre>');render()}
const VIEWS={
async overview(){const [o,c]=await Promise.all([api('/api/alpha/overview'),api('/api/alpha/coverage')]);
 return `<div class="warn">${esc(c.claim)}</div><div class="panel"><div class="ph"><h2>Market coverage registry</h2><button class="btn" onclick="act(this,'/api/alpha/research/run',{},render)">Run research cycle</button></div><div class="pb"><table><tr><th>Provider</th><th>Classes</th><th>Status</th><th>Freshness</th><th>Calls/failures</th><th>Known gaps</th></tr>
 ${c.providers.map(p=>`<tr><td>${esc(p.name)}<div class="sub">${esc(p.exchanges.join(', '))}</div></td><td>${esc(p.asset_classes.join(', '))}</td><td>${tag(p.status,p.status==='OK'?'g':p.status==='NOT_CONFIGURED'?'':'y')}</td><td>${p.freshness_seconds==null?'never':p.freshness_seconds+'s'}</td><td>${p.calls}/${p.failures}</td><td class="sub">${esc(p.known_gaps.join('; '))}</td></tr>`).join('')}</table>
 <p class="note">Requested but NOT integrated: ${esc(c.requested_exchanges_without_integration.join(', '))}. No integration: ${esc(c.asset_classes_without_integration.join(', '))}.</p></div></div>
 <div class="panel"><div class="ph"><h2>Research job</h2></div><div class="pb"><pre>${esc(JSON.stringify(o.research_job,null,1))}</pre></div></div>`},
async equities(){const d=await api('/api/alpha/leaderboard?asset_class=equity&limit=100');return scanBar('equities','<span class="sub">Needs Alpaca keys; US-listed only (IEX feed). No international exchanges integrated.</span>')+`<div class="panel"><div class="pb">${candTable(d.candidates)}</div></div>`},
async crypto(){const d=await api('/api/alpha/leaderboard?asset_class=crypto&limit=100');return scanBar('crypto','<span class="sub">Binance spot USDT pairs only.</span>')+`<div class="panel"><div class="pb">${candTable(d.candidates)}</div></div>`},
async tokens(){const d=await api('/api/alpha/leaderboard?asset_class=token&limit=100');const r=await api('/api/alpha/candidates/rejected?limit=40');return scanBar('dex','<span class="sub">DEX tokens are research-only: no execution venue, heuristic safety screen is not an audit.</span>')+`<div class="panel"><div class="ph"><h2>Passing the safety screen</h2></div><div class="pb">${candTable(d.candidates)}</div></div><div class="panel"><div class="ph"><h2>Rejected (kept with reasons)</h2></div><div class="pb">${candTable(r.candidates.filter(c=>c.asset_class==='token'))}</div></div>`},
async leader(){const [d,r]=await Promise.all([api('/api/alpha/leaderboard?limit=100'),api('/api/alpha/candidates/rejected?limit=50')]);return `<div class="panel"><div class="ph"><h2>Opportunity leaderboard</h2></div><div class="pb"><p class="note">Ranked by validated quality, not hype. Unvalidated candidates are discounted. Click a row for evidence.</p>${candTable(d.candidates)}</div></div><div class="panel"><div class="ph"><h2>Rejected / invalidated</h2></div><div class="pb">${candTable(r.candidates)}</div></div>`},
async inst(){const [a,o]=await Promise.all([api('/api/alpha/leaderboard?status=EARLY_ACCUMULATION&limit=100'),api('/api/alpha/investors/13f/overlap')]);return `<div class="panel"><div class="ph"><h2>Early accumulation candidates</h2></div><div class="pb">${candTable(a.candidates)}</div></div><div class="panel"><div class="ph"><h2>13F overlap (delayed quarterly snapshots)</h2></div><div class="pb"><p class="note">${esc(o.note)} Sync a filer below, then pass ?ciks via API for multi-filer overlap.</p><div class="row"><input id="cik" placeholder="filer CIK" size="14"><button class="btn primary" onclick="sync13f(this)">Sync latest two 13F filings</button></div><pre id="f13">${esc(JSON.stringify(o.overlaps.slice(0,10),null,1))}</pre></div></div>`},
async whales(){return `<div class="panel"><div class="ph"><h2>On-chain whale analysis</h2></div><div class="pb"><div class="warn">Addresses are unattributed unless a sourced label exists. Unverified labels are capped at 0.5 confidence and can never name an individual. No exchange addresses ship with ETI.</div><div class="row"><input id="wc" placeholder="chain label e.g. eth" size="10"><input id="wk" placeholder="token contract" size="30"><input id="wp" placeholder="price USD" size="8"><button class="btn primary" onclick="whale(this)">Analyse transfers</button></div><pre id="wo">Needs ALPHA_EXPLORER_BASE_URL and ALPHA_EXPLORER_API_KEY.</pre>
 <h2 style="font-size:.76rem;color:var(--cyan)">ADD WALLET LABEL</h2><div class="row"><input id="lc" placeholder="chain" size="8"><input id="la" placeholder="address" size="30"><input id="ll" placeholder="label" size="16"><select id="lt"><option>exchange</option><option>fund</option><option>treasury</option><option>protocol</option><option>unknown</option></select><input id="ls" placeholder="source URL" size="24"><input id="lf" placeholder="confidence 0-1" size="8"><label class="sub"><input type="checkbox" id="lv"> verified</label><button class="btn" onclick="addLabel(this)">Save label</button></div></div></div>`+
 `<div class="panel"><div class="ph"><h2>Stored labels</h2></div><div class="pb"><pre>${esc(JSON.stringify((await api('/api/alpha/whales/labels')).labels,null,1))}</pre></div></div>`},
async investors(){const [a,q]=await Promise.all([api('/api/alpha/investors/activity?limit=100'),api('/api/alpha/investors/qualifications')]);
 return `<div class="warn">Disclosures are delayed. Wealth or popularity never qualifies an investor. Assessments cannot authorize orders.</div><div class="panel"><div class="ph"><h2>Disclosed activity with freshness</h2></div><div class="pb">${a.activities.length?`<table><tr><th>Investor</th><th>Ticker</th><th>Type</th><th>Dates</th><th>Freshness</th><th>Verification</th><th></th></tr>`+a.activities.map(x=>`<tr><td>${esc(x.investor_name||x.institution)}</td><td>${esc(x.ticker||'—')}</td><td>${esc(x.category)} ${esc(x.direction||'')}</td><td class="sub">txn ${esc(x.transaction_date||'—')}<br>pub ${esc(x.publication_date||'—')}</td><td>${tag(x.freshness.level,x.freshness.level==='FRESH'?'g':x.freshness.level==='STALE'?'r':'y')}<div class="sub">delay ${x.freshness.information_delay_days??'?'}d</div></td><td>${esc(x.verification_status)}</td><td><button class="btn" data-a="assess" data-id="${esc(x.activity_id)}">12-step assessment</button></td></tr>`).join('')+'</table>':'<div class="empty">No stored disclosures. The investor monitor needs QUIVER_API_KEY or filings synced from SEC.</div>'}</div></div>
 <div class="panel"><div class="ph"><h2>Qualification decisions</h2></div><div class="pb">${q.qualifications.length?q.qualifications.map(x=>`<div>${tag(x.status,x.status==='QUALIFIED'?'g':x.status==='REJECTED'?'r':'y')} <b>${esc(x.name)}</b> <span class="sub">${esc(x.reasons.join('; '))}</span></div>`).join(''):'<div class="empty">None yet.</div>'}</div></div>`},
async sec(){const d=await api('/api/alpha/investors/activity?limit=200');const rows=d.activities.filter(x=>['13f_holding','insider_purchase','insider_buy','activist'].includes(x.category));return `<div class="panel"><div class="ph"><h2>SEC / filing monitor</h2></div><div class="pb"><p class="note">13F = quarterly, up to 45 days late, certain long positions only. Form 4 = within 2 business days. Sync a filer's 13F holdings from the Institutional tab.</p>${rows.length?rows.map(x=>`<div>${tag(x.freshness.level)}<b>${esc(x.investor_name||'')}</b> ${esc(x.category)} filed ${esc(x.publication_date||'?')} <span class="sub">${esc(x.freshness.warning)}</span></div>`).join(''):'<div class="empty">No SEC-sourced activity stored.</div>'}</div></div>`},
async elite(){const [p,a]=await Promise.all([api('/api/alpha/investors/profiles'),api('/api/alpha/investors/audit')]);return `<div class="warn">Profile audit: average completeness ${a.average_completeness_pct}% across the ${a.profiles} foundational profiles. PLACEHOLDER categories are research gaps, never filled with guesses.</div><div class="panel"><div class="pb"><table><tr><th>Name</th><th>Foundational</th><th>Completeness</th><th>Modules</th></tr>${p.profiles.sort((x,y)=>(x.completeness_pct??-1)-(y.completeness_pct??-1)).map(x=>`<tr class="click" tabindex="0" data-a="profile" data-id="${esc(x.id)}"><td>${esc(x.name)}</td><td>${x.foundational?'yes':''}</td><td>${sc(x.completeness_pct)}</td><td class="sub">${esc(x.strategy_modules.join(', '))}</td></tr>`).join('')}</table></div></div>`},
async newtraders(){const q=await api('/api/alpha/investors/qualifications');return `<div class="panel"><div class="ph"><h2>Qualify a candidate investor</h2></div><div class="pb"><div class="note">Criteria: ≥10 documented years, ≥2 independent sources incl. a primary one, primary/audited performance evidence, risk evidence, documented methodology, not nominated on wealth/popularity.</div><div class="row"><input id="qn" placeholder="name" size="20"><input id="qy" placeholder="years documented" size="8"><select id="qp"><option>audited</option><option>primary_reported</option><option>secondary_reported</option><option selected>none</option></select><select id="qb"><option>fund_level</option><option>personal_account</option><option>mixed</option><option selected>unknown</option></select><select id="qm"><option>documented_track_record</option><option>net_worth</option><option>social_following</option></select><label class="sub"><input type="checkbox" id="qr">risk evidence</label><label class="sub"><input type="checkbox" id="qd">methodology documented</label></div><div class="row"><input id="qs1" placeholder="primary source URL" size="30"><select id="qk1"><option>regulator_filing</option><option>fund_letter</option><option>audited_financials</option><option>own_book_or_paper</option><option>official_fund_disclosure</option></select><input id="qs2" placeholder="second source URL" size="30"><button class="btn primary" onclick="qualify(this)">Evaluate</button></div><pre id="qo"></pre></div></div><div class="panel"><div class="ph"><h2>Decisions</h2></div><div class="pb">${q.qualifications.map(x=>`<div>${tag(x.status,x.status==='QUALIFIED'?'g':x.status==='REJECTED'?'r':'y')}<b>${esc(x.name)}</b> <span class="sub">${esc(x.reasons.join('; '))}</span></div>`).join('')||'<div class="empty">None yet.</div>'}</div></div>`},
async lab(){const d=await api('/api/alpha/strategies');return `<div class="warn">${esc(d.honesty)} Modules needing macro/fundamental data are listed but never given a simulated result.</div><div class="panel"><div class="pb"><table><tr><th>Module</th><th>Inspired by</th><th>Family</th><th>Testable</th><th>Fidelity</th><th>Status</th></tr>${d.strategies.map(s=>`<tr class="click" tabindex="0" data-a="strat" data-id="${esc(s.id)}"><td>${esc(s.name)}<div class="sub">${esc(s.source_basis)}</div></td><td>${esc(s.inspired_by.join(', '))}</td><td>${esc(s.family)}</td><td>${s.executable?tag('executable','g'):tag('needs data','y')}</td><td class="sub">${esc(s.fidelity)}</td><td>${s.states.map(x=>tag(x.asset_class+': '+x.status,x.status==='CHAMPION'?'g':'')).join('')||'—'}</td></tr>`).join('')}</table></div></div>`},
async comp(){const r=await api('/api/alpha/strategies/runs?limit=60');return `<div class="panel"><div class="ph"><h2>Elite strategy competition</h2><div class="row" style="margin:0"><button class="btn primary" onclick="runComp(this)">Run competition (pooled walk-forward on major crypto)</button></div></div><div class="pb"><p class="note">Out-of-sample only; costs included; promotion needs ≥30 OOS trades, t-stat with multiple-testing haircut, profit factor, fold consistency, drawdown and IS→OOS stability. Champion needs two consecutive passes.</p>${r.runs.length?`<table><tr><th>Strategy</th><th>Symbol</th><th>Verdict</th><th>OOS trades</th><th>Expectancy %</th><th>t-stat</th><th>PF</th><th>Max DD %</th></tr>${r.runs.map(x=>{const o=x.out_of_sample||{};return `<tr><td>${esc(x.strategy_id)}</td><td>${esc(x.symbol)}</td><td>${tag(x.verdict,x.verdict==='PROMOTE'?'g':x.verdict==='FAIL'?'r':'y')}</td><td>${fmt(o.trades,0)}</td><td>${fmt(o.expectancy_pct)}</td><td>${fmt(o.t_stat)}</td><td>${fmt(o.profit_factor)}</td><td>${fmt(o.max_drawdown_pct)}</td></tr>`}).join('')}</table>`:'<div class="empty">No runs yet.</div>'}</div></div>
 <div class="panel"><div class="ph"><h2>Test a strategy combination</h2></div><div class="pb"><div class="row"><input id="ca" placeholder="module A" size="22" value="turtle_donchian"><input id="cb" placeholder="module B" size="22" value="seykota_ema"><input id="cs" value="BTCUSDT" size="10"><button class="btn primary" onclick="combo(this)">Test as independent model</button></div><pre id="co"></pre></div></div>`},
async engines(){const [c,d]=await Promise.all([api('/api/alpha/overview'),api('/api/alpha/leaderboard?limit=30')]);const v=d.candidates.filter(x=>x.validated_at);return `<div class="panel"><div class="ph"><h2>Evidence tools</h2></div><div class="pb"><div class="row"><button class="btn primary" onclick="macro(this)">Load macro regime (FRED)</button><input id="ft" placeholder="US ticker" size="8"><input id="fp" placeholder="price (optional)" size="10"><button class="btn primary" onclick="fundamentalsOf(this)">SEC fundamentals screen</button></div><pre id="eo">Macro needs FRED_API_KEY. Fundamentals use SEC XBRL (annual 10-K). Both are live screens, not backtests.</pre></div></div>`+`<div class="warn">Three independent layers: Discovery finds, Research studies, Decision validates. Discovery can never set CONFIRMED. OMNISIGNAL X (Swift + GainzAlgo engines, fusion and validator) is consumed read-only from the Worker when OMNISIGNAL_BASE_URL is set; further engines attach through <code>register_engine</code>.</div><div class="panel"><div class="ph"><h2>Independently validated candidates</h2></div><div class="pb">${candTable(v)}</div></div>`},
async trading(){const p=await api('/api/alpha/plans');return `<div class="warn">Paper/testnet only by default. Live needs LIVE_TRADING_ENABLED + ALPHA_LIVE_EXECUTION_AUTHORIZED + API_KEY + the confirmation phrase, and still passes the RiskEngine. Stops/targets are ETI-managed by the monitor.</div><div class="panel"><div class="ph"><h2>Trade plans</h2><button class="btn" onclick="act(this,'/api/alpha/monitor',{},render)">Run position monitor</button></div><div class="pb">${p.plans.length?`<table><tr><th>Symbol</th><th>Env</th><th>Status</th><th>Entry</th><th>Stop</th><th>TP1/2/3</th><th>Qty left</th><th>PnL</th><th>Reason</th></tr>${p.plans.map(x=>`<tr><td>${esc(x.symbol)}</td><td>${esc(x.environment)}</td><td>${tag(x.status,x.status==='OPEN'?'g':x.status==='CLOSED'?'':'r')}</td><td>${fmt(x.entry,6)}</td><td>${fmt(x.stop,6)}</td><td class="sub">${fmt(x.tp1,4)} / ${fmt(x.tp2,4)} / ${fmt(x.tp3,4)}</td><td>${fmt(x.remaining_qty,6)}</td><td>${fmt(x.pnl)}</td><td>${esc(x.close_reason||'')}</td></tr>`).join('')}</table>`:'<div class="empty">No plans.</div>'}</div></div><div class="panel"><div class="ph"><h2>Audit log</h2></div><div class="pb"><pre>${esc(JSON.stringify((await api('/api/alpha/audit-log?limit=25')).entries,null,1))}</pre></div></div>`},
async portfolio(){const [a,b]=await Promise.all([api('/api/paper-trading/portfolio?environment=paper'),api('/api/paper-trading/positions?environment=paper')]);return `<div class="panel"><div class="ph"><h2>Paper portfolio</h2></div><div class="pb"><pre>${esc(JSON.stringify(a,null,1))}</pre>${b.length?`<table><tr><th>Symbol</th><th>Qty</th><th>Entry</th><th>Mark</th><th>Unrealized</th></tr>${b.map(p=>`<tr><td>${esc(p.symbol)}</td><td>${fmt(p.qty,6)}</td><td>${fmt(p.avg_entry,6)}</td><td>${fmt(p.mark_price,6)}</td><td>${fmt(p.unrealized_pnl)}</td></tr>`).join('')}</table>`:'<div class="empty">No open positions.</div>'}</div></div>`},
async perf(){const [m,v]=await Promise.all([api('/api/predictions/metrics'),api('/api/alpha/predictions?limit=50')]);const o=m.overall||{};return `<div class="panel"><div class="ph"><h2>Prediction accountability</h2><a class="nav" href="/predictions">Full ledger</a></div><div class="pb"><p class="note">Alpha predictions are written at decision time to ETI's single immutable prediction ledger (ORM guards and database triggers block edits and deletes). Outcomes, calibration and monthly reports come from that ledger. Probabilities are uncalibrated priors until calibration data accumulates.</p><pre>${esc(JSON.stringify(o,null,1))}</pre>${v.predictions.length?`<table><tr><th>Created</th><th>Asset</th><th>Dir</th><th>Entry</th><th>Base target</th><th>Invalidation</th><th>Horizon</th><th>Probability</th><th>Regime</th></tr>${v.predictions.map(x=>`<tr><td class="sub">${esc((x.created_at||'').slice(0,16))}</td><td>${esc(x.asset)}</td><td>${esc(x.direction)}</td><td>${fmt(x.entry_reference,6)}</td><td>${fmt(x.target_base,6)}</td><td>${fmt(x.invalidation_price,6)}</td><td>${esc(x.horizon_label)}</td><td>${x.probability}</td><td>${esc(x.market_regime||'')}</td></tr>`).join('')}</table>`:'<div class="empty">No alpha predictions recorded yet — no accuracy is claimed.</div>'}</div></div>`}
};
async function profile(id){const p=await api('/api/alpha/investors/profiles/'+id);const au=p.audit||{};
 const L=a=>(Array.isArray(a)?a:[a]).filter(Boolean).map(x=>typeof x==='object'?`${esc(x.claim)} <span class="sub">[${esc(x.classification)}${x.source?' · '+esc(x.source):' · no source'}]</span>`:esc(x)).join('<br>')||'—';
 openM(p.full_name,`<p>${(p.tags||[]).map(t=>tag(t)).join('')}${tag('v'+p._version)}</p><p class="note">Completeness ${au.completeness_pct}% · gaps: ${esc((au.research_gaps||[]).join(', ')||'none')}</p>
 ${[['Biography',p.biography],['Trading history',p.trading_history],['Philosophy',p.philosophy],['Entry criteria',p.entry_criteria],['Exit criteria',p.exit_criteria],['Stop-loss',p.stop_loss_methodology],['Position sizing',p.position_sizing],['Historical returns',p.historical_returns],['Drawdowns',p.historical_drawdowns],['Win rates',p.win_rates],['Net worth',p.net_worth],['Famous trades',p.famous_successful_trades],['Failed trades',p.famous_unsuccessful_trades],['Strengths',p.strengths],['Weaknesses',p.weaknesses],['Lessons for ETI',p.eti_lessons]].map(r=>`<p><b>${r[0]}</b><br>${L(r[1])}</p>`).join('')}
 <p><b>Strategy modules</b> ${(p.inspired_modules_detail||[]).map(m=>tag(m.name+(m.executable?'':' (needs data)'),m.executable?'g':'y')).join('')}</p><p><b>Version history</b></p><pre>${esc(JSON.stringify(p.history,null,1))}</pre>`)}
async function strat(id){const d=await api('/api/alpha/strategies');const s=d.strategies.find(x=>x.id===id);const r=await api('/api/alpha/strategies/runs?strategy_id='+id+'&limit=5');openM(s.name,`<pre>${esc(JSON.stringify(s,null,1))}</pre><p><b>Recent runs</b></p><pre>${esc(JSON.stringify(r.runs,null,1))}</pre>`)}
async function macro(b){try{$('#eo').textContent=JSON.stringify(await api('/api/alpha/macro'),null,1)}catch(e){toast(e.message)}}
async function fundamentalsOf(b){try{const t=$('#ft').value.trim();const p=$('#fp').value.trim();$('#eo').textContent=JSON.stringify(await api('/api/alpha/fundamentals/'+encodeURIComponent(t)+(p?'?price='+encodeURIComponent(p):'')),null,1)}catch(e){toast(e.message)}}
async function runComp(b){const r=await act(b,'/api/alpha/strategies/competition',null);if(r){openM('Competition result','<pre>'+esc(JSON.stringify(r.leaderboard.slice(0,15),null,1))+'</pre>');render()}}
async function combo(b){const r=await act(b,'/api/alpha/strategies/combination',{a:$('#ca').value,b:$('#cb').value,symbol:$('#cs').value});if(r)$('#co').textContent=JSON.stringify({verdict:r.verdict,reasons:r.reasons,oos:r.out_of_sample},null,1)}
async function sync13f(b){const r=await act(b,'/api/alpha/investors/13f/sync',{cik:$('#cik').value.trim()});if(r)$('#f13').textContent=JSON.stringify(r,null,1)}
async function whale(b){try{const q=new URLSearchParams({chain:$('#wc').value,contract:$('#wk').value,price_usd:$('#wp').value});$('#wo').textContent=JSON.stringify(await api('/api/alpha/whales/analysis?'+q),null,1)}catch(e){toast(e.message)}}
async function addLabel(b){const r=await act(b,'/api/alpha/whales/labels',{chain:$('#lc').value,address:$('#la').value,label:$('#ll').value,entity_type:$('#lt').value,source:$('#ls').value,confidence:parseFloat($('#lf').value),verified:$('#lv').checked});if(r)render()}
async function qualify(b){const src=[{kind:$('#qk1').value,url:$('#qs1').value},{kind:'secondary',url:$('#qs2').value}].filter(s=>s.url);
 const r=await act(b,'/api/alpha/investors/qualify',{name:$('#qn').value,years_documented:parseFloat($('#qy').value||0),sources:src,performance_evidence:$('#qp').value,return_basis:$('#qb').value,risk_evidence:$('#qr').checked,methodology_documented:$('#qd').checked,basis_of_nomination:$('#qm').value});
 if(r)$('#qo').textContent=JSON.stringify(r,null,1)}
async function assess(id){const q=prompt('Is the investor QUALIFIED under ETI criteria? (yes/no)','no');const r=await api('/api/alpha/investors/assess',{method:'POST',body:{activity_id:id,investor_qualified:(q||'').toLowerCase().startsWith('y')}});openM('12-step following assessment — '+r.classification,`<div class="warn">${esc(r.rule)}</div><table><tr><th>#</th><th>Step</th><th>Result</th><th>Detail</th></tr>${r.checks.map(c=>`<tr><td>${c.step}</td><td>${esc(c.name)}</td><td>${c.pass===null?tag('pending','y'):c.pass?tag('pass','g'):tag(c.hard?'FAIL (hard)':'fail','r')}</td><td>${esc(c.detail)}</td></tr>`).join('')}</table>`)}
const HANDLERS={cand:candDetail,profile:profile,strat:strat,assess:assess};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=HANDLERS[el.dataset.a];if(f)f(el.dataset.id)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'){const el=e.target.closest&&e.target.closest('tr[data-a]');if(el){const f=HANDLERS[el.dataset.a];if(f)f(el.dataset.id)}}});
cur=(location.hash||'#overview').slice(1);if(!VIEWS[cur])cur='overview';render();
</script>
</body>
</html>
